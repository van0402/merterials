<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo - Công ty mới tham gia (trang home)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--orange:#f97316;--orange-2:#ff8a24;--orange-soft:#fff0df;--navy:#10182f;--muted:#6b7280;--line:#eef0f3;--bg:#fffaf5}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--navy)}
.wrap{max-width:1180px;margin:auto;padding:56px 20px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.section-head h2{font-size:26px;font-weight:900;letter-spacing:-0.02em;margin:0 0 6px}
.section-head p{margin:0;color:var(--muted);font-size:14px}
.eyebrow{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--orange-soft);color:#b74d08;font-size:11.5px;font-weight:800;border:1px solid #f5d9bb}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:16px;box-shadow:0 6px 18px rgba(16,24,47,0.04);transition:.15s}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(16,24,47,0.08);border-color:#fcd9b6}
.card-top{display:flex;align-items:center;gap:10px}
.avatar{flex:none;width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#334155,#0f172a);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;letter-spacing:.01em}
.card-name{font-size:13.5px;font-weight:800;line-height:1.25}
.card-sub{font-size:11.5px;color:var(--muted);line-height:1.45;min-height:32px}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;background:#ecfdf5;color:#047857;font-size:10.5px;font-weight:800;padding:5px 9px;border-radius:999px}
.badge svg{width:11px;height:11px}

.footer-cta{display:flex;justify-content:center;margin-top:28px}
.footer-cta a{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--orange),var(--orange-2));color:#fff;font-weight:800;font-size:13.5px;padding:12px 22px;border-radius:13px;text-decoration:none;box-shadow:0 10px 24px rgba(249,115,22,0.25)}

.empty{text-align:center;padding:60px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:16px;background:#fff}

@media (max-width: 980px){ .grid{grid-template-columns:repeat(2,1fr)} }
@media (max-width: 560px){ .grid{grid-template-columns:1fr} .section-head{flex-direction:column;align-items:flex-start} }
</style>
</head>
<body>
<div class="wrap">
  <div class="section-head">
    <div>
      <span class="eyebrow">Mới cập nhật</span>
      <h2 style="margin-top:10px">Công ty mới tham gia hệ thống</h2>
      <p>Các nhà cung cấp vừa được duyệt và công khai trên nền tảng.</p>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="footer-cta">
    <a href="#">Xem tất cả nhà cung cấp →</a>
  </div>

  <p style="text-align:center;margin-top:14px;font-size:11.5px;color:var(--muted)">
    (Demo tĩnh — dữ liệu mẫu lấy tên thật đang có trong hệ thống để hình dung, số lượng thẻ sẽ tự thay đổi theo số công ty đã duyệt thực tế)
  </p>
</div>

<script>
const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>';

function initials(name) {
  return name.split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

const companies = [
  { name: 'BIGWAVE AI, INC', sub: 'AI / Trí tuệ nhân tạo' },
  { name: 'InnoKeep', sub: 'Phát triển phần mềm quản lý thiết bị, bảo trì nhà máy ứng dụng AI' },
  { name: 'SORA MACHINE MANUFACTURING JOINT STOCK COMPANY', sub: 'Machine Manufacturing / Sản xuất máy móc' },
  { name: 'THINKSMART', sub: '3D Scanner & 3D Printer; Engineering Design & Simulation' },
  { name: 'PRECITEC Vietnam', sub: 'Công nghệ laser – Đo lường chính xác – Machine Vision' },
  { name: 'AVATECH', sub: 'Advanced Vision Automation' },
  { name: 'AUBOT', sub: 'Sản xuất, kinh doanh thiết bị tự động hóa và robot công nghiệp' },
  { name: 'EURORACK MECHANICAL JSC', sub: 'Smart Warehouse & Automated Storage' },
];

document.getElementById('grid').innerHTML = companies.map(c => `
  <article class="card">
    <div class="card-top">
      <div class="avatar">${initials(c.name)}</div>
      <div class="card-name">${c.name}</div>
    </div>
    <div class="card-sub">${c.sub}</div>
    <span class="badge">${CHECK_SVG} Đã duyệt</span>
  </article>
`).join('');
</script>
</body>
</html>
