services:
  proxy:
    image: nginx:1.27-alpine
    container_name: refferq-proxy
    restart: unless-stopped
    ports:
      - "8300:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - socket
    networks:
      - refferq-network

  app:
    image: refferq-prod:latest
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://affiliate.smee.vn}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://affiliate.smee.vn}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-https://affiliate.smee.vn}
    container_name: refferq-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://affiliate.smee.vn}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://affiliate.smee.vn}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-https://affiliate.smee.vn}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-SMEE <noreply@example.com>}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@smee.vn}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change-me-webhook-secret}
      CRON_SECRET: ${CRON_SECRET:-change-me-cron-secret}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@smee.vn}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-123456}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - refferq-network

  socket:
    image: refferq-prod:latest
    container_name: refferq-socket
    restart: unless-stopped
    command: npm run socket
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      SOCKET_PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://affiliate.smee.vn}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://affiliate.smee.vn}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-https://affiliate.smee.vn}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - refferq-network

  redis:
    image: redis:7-alpine
    container_name: refferq-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - refferq-network

  db:
    image: postgres:16-alpine
    container_name: refferq-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-refferq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-refferq}
      POSTGRES_DB: ${POSTGRES_DB:-refferq}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-refferq} -d ${POSTGRES_DB:-refferq}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - refferq-network

volumes:
  postgres_data:
  redis_data:

networks:
  refferq-network:
    driver: bridge
