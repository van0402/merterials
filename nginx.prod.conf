upstream refferq_next {
    server app:3000;
}

upstream refferq_socket {
    server socket:3001;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # Socket.IO realtime endpoint. Public URL: https://affiliate.smee.vn/socket.io/
    location /socket.io/ {
        proxy_pass http://refferq_socket/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # Next.js app. Public URL: https://affiliate.smee.vn/
    location / {
        proxy_pass http://refferq_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
